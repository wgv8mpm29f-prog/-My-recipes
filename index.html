<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Рецепты"><meta name="theme-color" content="#f6f1eb"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><title>Мои рецепты</title>
<style>:root{--bg:#f6f1eb;--card:#fffdf9;--txt:#3e3834;--muted:#80766f;--accent:#b1765b;--soft:#eee3d9;--line:#e3d6cc;--danger:#9c4d4d;--shadow:0 8px 26px rgba(70,50,40,.06)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}body{padding-bottom:calc(88px + env(safe-area-inset-bottom))}header{position:sticky;top:0;z-index:20;background:rgba(246,241,235,.96);backdrop-filter:blur(14px);padding:calc(12px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line)}h1{font-size:28px;margin:0 0 3px}.lead{font-size:13px;color:var(--muted);margin-bottom:10px}.search{width:100%;border:1px solid var(--line);border-radius:16px;background:#fff;padding:13px 14px;font-size:16px;outline:none}main{max-width:980px;margin:auto;padding:14px}.section{font-weight:750;font-size:17px;margin:4px 0 10px}.catgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}.cat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);min-height:92px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;color:var(--txt)}.cat .emoji{font-size:26px}.cat .name{font-weight:750}.cat .count{font-size:12px;color:var(--muted)}.chips{display:flex;gap:8px;overflow:auto;padding-bottom:12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border:1px solid var(--line);background:white;color:var(--txt);border-radius:999px;padding:8px 12px}.chip.on{background:var(--soft);border-color:var(--soft)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}.cover{width:100%;aspect-ratio:16/9;object-fit:cover;background:#eee}.cardbody{padding:15px}.title{font-size:21px;font-weight:760}.meta{font-size:13px;color:var(--muted);margin-top:4px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.tag{background:#f1ebe5;border-radius:999px;padding:5px 8px;font-size:12px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{font:inherit;border:0;border-radius:14px;padding:11px 14px;background:var(--accent);color:white;cursor:pointer}.secondary{background:#fff;color:var(--txt);border:1px solid var(--line)}.danger{color:var(--danger)}.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:30;width:58px;height:58px;border-radius:50%;font-size:30px;box-shadow:0 10px 26px rgba(80,53,41,.18)}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(255,255,255,.97);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 14px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px}.bottom button{flex:1;background:#fff;color:var(--txt);border:1px solid var(--line)}dialog{width:min(760px,96vw);max-height:92vh;border:0;border-radius:22px;padding:0;box-shadow:0 18px 70px rgba(0,0,0,.28)}dialog::backdrop{background:rgba(0,0,0,.3)}.modal{padding:18px}.modal h2{margin:0 0 14px}.field{margin-bottom:12px}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:5px}input[type=text],textarea,input[type=file],select{width:100%;font:inherit;border:1px solid var(--line);border-radius:14px;padding:12px;background:white}textarea{min-height:105px;resize:vertical}.preview{width:100%;max-height:240px;object-fit:cover;border-radius:16px;margin-top:8px;display:none}.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}.recipe h2{font-size:28px;margin-bottom:4px}.recipe h3{margin:20px 0 7px}.recipe pre{white-space:pre-wrap;font:inherit;line-height:1.5;background:#faf7f3;padding:13px;border-radius:14px}.empty{text-align:center;color:var(--muted);padding:48px 10px}.install-note{display:none;background:#fff8ef;border:1px solid #ead7c4;border-radius:16px;padding:12px;margin-bottom:14px;font-size:14px}@media(min-width:720px){.catgrid{grid-template-columns:repeat(4,1fr)}header{padding-left:22px;padding-right:22px}.fab{right:30px}}</style></head><body>
<header><h1>🍲 Мои рецепты</h1><div class="lead">Личная книга рецептов — без подписки</div><input id="search" class="search" type="search" placeholder="Поиск по названию или ингредиентам"></header>
<main><div id="installNote" class="install-note">На iPhone: Safari → Поделиться → «На экран Домой».</div><div class="section">Разделы</div><div id="catgrid" class="catgrid"></div><div class="section">Рецепты</div><div id="chips" class="chips"></div><div id="grid" class="grid"></div></main>
<button class="fab" onclick="openEdit()">＋</button><div class="bottom"><button onclick="exportBackup()">Резервная копия</button><button onclick="document.getElementById('import').click()">Восстановить</button><input id="import" type="file" accept="application/json" hidden></div>
<dialog id="editDlg"><form class="modal" onsubmit="saveRecipe(event)"><h2 id="editTitle">Новый рецепт</h2><div class="field"><label>Название</label><input id="name" type="text" required></div><div class="field"><label>Категория</label><select id="category"><option>Выпечка</option><option>Завтраки</option><option>Салаты</option><option>Горячее</option><option>Рыба</option><option>Мясо</option><option>Детям</option><option>Десерты</option><option>Другое</option></select></div><div class="field"><label>Время</label><input id="time" type="text" placeholder="55–60 минут"></div><div class="field"><label>Теги через запятую</label><input id="tags" type="text" placeholder="банан, кекс, быстро"></div><div class="field"><label>Фото блюда</label><input id="photo" type="file" accept="image/*"><img id="preview" class="preview"></div><div class="field"><label>Ингредиенты — каждый с новой строки</label><textarea id="ingredients" required></textarea></div><div class="field"><label>Приготовление</label><textarea id="steps" required></textarea></div><div class="field"><label>Заметки</label><textarea id="notes"></textarea></div><div class="actions"><button type="button" class="secondary" onclick="editDlg.close()">Отмена</button><button type="submit">Сохранить</button></div></form></dialog>
<dialog id="viewDlg"><div class="modal recipe"><div id="view"></div><div class="actions"><button class="secondary" onclick="viewDlg.close()">Закрыть</button></div></div></dialog>
<script>
const DB='MyRecipesFinalDB',STORE='recipes';let recipes=[],editingId=null,currentPhoto='',active='Все';const preferredCats=[['Выпечка','🧁'],['Завтраки','🍳'],['Салаты','🥗'],['Горячее','🍲'],['Рыба','🐟'],['Мясо','🥩'],['Детям','🧸'],['Избранное','★']];
function dbOpen(){return new Promise((res,rej)=>{const q=indexedDB.open(DB,1);q.onupgradeneeded=()=>q.result.createObjectStore(STORE,{keyPath:'id'});q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}async function dbAll(){const db=await dbOpen();return new Promise((res,rej)=>{const t=db.transaction(STORE,'readonly'),q=t.objectStore(STORE).getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}async function dbPut(r){const db=await dbOpen();return new Promise((res,rej)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(r);t.oncomplete=res;t.onerror=()=>rej(t.error)})}async function dbDelete(id){const db=await dbOpen();return new Promise((res,rej)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
const starter={id:'banana-cake',name:'Банановый кекс',category:'Выпечка',time:'55–60 минут',tags:['банан','кекс','быстро'],favorite:true,photo:'',ingredients:`150 г муки\n80 г сливочного масла\n90–100 г сахара\n1 яйцо\n1 ч. л. ванильного сахара\n100 г натурального греческого йогурта\n100–120 г бананового пюре\n2/3 ч. л. соды\nщепотка соли`,steps:`1. Размять банан в пюре.\n2. Смешать мягкое сливочное масло с сахаром.\n3. Добавить яйцо, ваниль, йогурт и банановое пюре.\n4. Отдельно смешать муку, соду и соль.\n5. Соединить сухие и влажные ингредиенты, не вымешивая слишком долго.\n6. Переложить в форму примерно 21 × 11 см.\n7. Выпекать при 180 °C около 55–60 минут. Проверить шпажкой.`,notes:'Если банан очень спелый, достаточно 90 г сахара. Йогурт 0% подходит вместо сметаны 20%.'};
async function init(){recipes=await dbAll();if(!recipes.length){await dbPut(starter);recipes=[starter]}render();if(!window.matchMedia('(display-mode: standalone)').matches)installNote.style.display='block';if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})}const esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function renderCategories(){catgrid.innerHTML=preferredCats.map(([name,emoji])=>{const count=name==='Избранное'?recipes.filter(r=>r.favorite).length:recipes.filter(r=>r.category===name).length;return `<button class="cat" onclick="active='${name==='Избранное'?'★ Избранное':name}';render()"><div class="emoji">${emoji}</div><div><div class="name">${name}</div><div class="count">${count}</div></div></button>`}).join('')}
function render(){renderCategories();const cats=['Все','★ Избранное',...new Set(recipes.map(r=>r.category).filter(Boolean))];chips.innerHTML=cats.map(c=>`<button class="chip ${c===active?'on':''}" onclick="active='${esc(c).replace(/'/g,"\\'")}';render()">${esc(c)}</button>`).join('');const q=search.value.trim().toLowerCase();const list=recipes.filter(r=>{const cat=active==='Все'||(active==='★ Избранное'?r.favorite:r.category===active);const hay=[r.name,r.category,(r.tags||[]).join(' '),r.ingredients,r.steps,r.notes].join(' ').toLowerCase();return cat&&(!q||hay.includes(q))}).sort((a,b)=>(b.favorite?1:0)-(a.favorite?1:0)||a.name.localeCompare(b.name,'ru'));grid.innerHTML=list.length?list.map(r=>`<article class="card">${r.photo?`<img class="cover" src="${r.photo}">`:''}<div class="cardbody"><div class="title">${r.favorite?'★ ':''}${esc(r.name)}</div><div class="meta">${esc(r.category||'Без категории')}${r.time?' · '+esc(r.time):''}</div><div class="tags">${(r.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="row"><button onclick="viewRecipe('${r.id}')">Открыть</button><button class="secondary" onclick="openEdit('${r.id}')">Изменить</button><button class="secondary" onclick="toggleFav('${r.id}')">${r.favorite?'★':'☆'}</button></div></div></article>`).join(''):`<div class="empty">В этом разделе пока нет рецептов.</div>`}
function openEdit(id=null){editingId=id;const r=id?recipes.find(x=>x.id===id):null;editTitle.textContent=r?'Изменить рецепт':'Новый рецепт';name.value=r?.name||'';category.value=r?.category||'Выпечка';time.value=r?.time||'';tags.value=(r?.tags||[]).join(', ');ingredients.value=r?.ingredients||'';steps.value=r?.steps||'';notes.value=r?.notes||'';currentPhoto=r?.photo||'';preview.src=currentPhoto;preview.style.display=currentPhoto?'block':'none';photo.value='';editDlg.showModal()}
photo.addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;const img=new Image(),url=URL.createObjectURL(f);await new Promise(ok=>{img.onload=ok;img.src=url});const max=1400,scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);currentPhoto=c.toDataURL('image/jpeg',.82);URL.revokeObjectURL(url);preview.src=currentPhoto;preview.style.display='block'});
async function saveRecipe(e){e.preventDefault();const old=editingId?recipes.find(x=>x.id===editingId):null;const r={id:editingId||crypto.randomUUID(),name:name.value.trim(),category:category.value,time:time.value.trim(),tags:tags.value.split(',').map(x=>x.trim()).filter(Boolean),photo:currentPhoto,ingredients:ingredients.value.trim(),steps:steps.value.trim(),notes:notes.value.trim(),favorite:old?.favorite||false};await dbPut(r);recipes=await dbAll();editDlg.close();render()}async function toggleFav(id){const r=recipes.find(x=>x.id===id);r.favorite=!r.favorite;await dbPut(r);recipes=await dbAll();render()}
function viewRecipe(id){const r=recipes.find(x=>x.id===id);view.innerHTML=`${r.photo?`<img class="cover" style="border-radius:16px" src="${r.photo}">`:''}<h2>${r.favorite?'★ ':''}${esc(r.name)}</h2><div class="meta">${esc(r.category||'')}${r.time?' · '+esc(r.time):''}</div><h3>Ингредиенты</h3><pre>${esc(r.ingredients)}</pre><h3>Приготовление</h3><pre>${esc(r.steps)}</pre>${r.notes?`<h3>Заметки</h3><pre>${esc(r.notes)}</pre>`:''}<div class="row"><button onclick="viewDlg.close();openEdit('${r.id}')">Изменить</button><button class="secondary danger" onclick="removeRecipe('${r.id}')">Удалить</button></div>`;viewDlg.showModal()}async function removeRecipe(id){if(confirm('Удалить рецепт?')){await dbDelete(id);recipes=await dbAll();viewDlg.close();render()}}
async function exportBackup(){const data=await dbAll();const blob=new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),recipes:data},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Рецепты_backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
import.addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const x=JSON.parse(await f.text()),arr=Array.isArray(x)?x:x.recipes;if(!Array.isArray(arr))throw 0;for(const r of arr)await dbPut(r);recipes=await dbAll();render();alert('Рецепты восстановлены.')}catch{alert('Не удалось прочитать резервную копию.')}e.target.value=''});search.addEventListener('input',render);init();
</script></body></html>
