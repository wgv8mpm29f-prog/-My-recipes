<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Рецепты">
<meta name="theme-color" content="#f6f1eb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Мои рецепты</title>
<style>
:root{--bg:#f6f1eb;--card:#fffdf9;--txt:#3e3834;--muted:#80766f;--accent:#b1765b;--soft:#eee3d9;--line:#e3d6cc;--danger:#9c4d4d;--shadow:0 8px 26px rgba(70,50,40,.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}body{padding-bottom:calc(88px + env(safe-area-inset-bottom))}header{position:sticky;top:0;z-index:20;background:rgba(246,241,235,.96);backdrop-filter:blur(14px);padding:calc(12px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line)}h1{font-size:28px;margin:0 0 3px}.lead{font-size:13px;color:var(--muted);margin-bottom:10px}.search{width:100%;border:1px solid var(--line);border-radius:16px;background:#fff;padding:13px 14px;font-size:16px;outline:none}main{max-width:980px;margin:auto;padding:14px}.section{font-weight:750;font-size:17px;margin:4px 0 10px}.catgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}.cat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);min-height:92px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;color:var(--txt)}.cat .emoji{font-size:26px}.cat .name{font-weight:750}.cat .count{font-size:12px;color:var(--muted)}.chips{display:flex;gap:8px;overflow:auto;padding-bottom:12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border:1px solid var(--line);background:white;color:var(--txt);border-radius:999px;padding:8px 12px}.chip.on{background:var(--soft);border-color:var(--soft)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}.cover{width:100%;aspect-ratio:16/9;object-fit:cover;background:#eee}.cardbody{padding:15px}.title{font-size:21px;font-weight:760}.meta{font-size:13px;color:var(--muted);margin-top:4px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.tag{background:#f1ebe5;border-radius:999px;padding:5px 8px;font-size:12px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{font:inherit;border:0;border-radius:14px;padding:11px 14px;background:var(--accent);color:white;cursor:pointer}.secondary{background:#fff;color:var(--txt);border:1px solid var(--line)}.danger{color:var(--danger)}.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:30;width:58px;height:58px;border-radius:50%;font-size:30px;box-shadow:0 10px 26px rgba(80,53,41,.18)}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(255,255,255,.97);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 14px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px}.bottom button{flex:1;background:#fff;color:var(--txt);border:1px solid var(--line)}
.overlay{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.32);display:none;align-items:flex-end;justify-content:center}.overlay.open{display:flex}.sheet{background:var(--card);width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -18px 70px rgba(0,0,0,.16)}.sheet h2{margin:0 0 14px}.field{margin-bottom:12px}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:5px}input[type=text],textarea,input[type=file],select{width:100%;font:inherit;border:1px solid var(--line);border-radius:14px;padding:12px;background:white}textarea{min-height:105px;resize:vertical}.preview{width:100%;max-height:240px;object-fit:cover;border-radius:16px;margin-top:8px;display:none}.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}.recipe h2{font-size:28px;margin-bottom:4px}.recipe h3{margin:20px 0 7px}.recipe pre{white-space:pre-wrap;font:inherit;line-height:1.5;background:#faf7f3;padding:13px;border-radius:14px}.empty{text-align:center;color:var(--muted);padding:48px 10px}.install-note{display:none;background:#fff8ef;border:1px solid #ead7c4;border-radius:16px;padding:12px;margin-bottom:14px;font-size:14px}.error{background:#fff0ef;border:1px solid #e1b4b0;color:#7f3732;padding:12px;border-radius:14px;margin-bottom:12px;display:none}
@media(min-width:720px){.catgrid{grid-template-columns:repeat(4,1fr)}header{padding-left:22px;padding-right:22px}.fab{right:30px}.overlay{align-items:center}.sheet{border-radius:24px;max-height:88vh}}
</style>
</head>
<body>
<header><h1>🍲 Мои рецепты</h1><div class="lead">Личная книга рецептов — без подписки</div><input id="search" class="search" type="search" placeholder="Поиск по названию или ингредиентам"></header>
<main><div id="installNote" class="install-note">На iPhone: Safari → Поделиться → «На экран Домой».</div><div id="errorBox" class="error"></div><div class="section">Разделы</div><div id="catgrid" class="catgrid"></div><div class="section">Рецепты</div><div id="chips" class="chips"></div><div id="grid" class="grid"></div></main>
<button id="addBtn" class="fab" type="button" aria-label="Добавить рецепт">＋</button>
<div class="bottom"><button id="backupBtn" type="button">Резервная копия</button><button id="restoreBtn" type="button">Восстановить</button><input id="importFile" type="file" accept="application/json" hidden></div>

<div id="editOverlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="editTitle">
  <form id="editForm" class="sheet">
    <h2 id="editTitle">Новый рецепт</h2>
    <div class="field"><label for="recipeName">Название</label><input id="recipeName" type="text" required></div>
    <div class="field"><label for="category">Категория</label><select id="category"><option>Выпечка</option><option>Завтраки</option><option>Салаты</option><option>Горячее</option><option>Рыба</option><option>Мясо</option><option>Детям</option><option>Десерты</option><option>Другое</option></select></div>
    <div class="field"><label for="time">Время</label><input id="time" type="text" placeholder="55–60 минут"></div>
    <div class="field"><label for="tags">Теги через запятую</label><input id="tags" type="text" placeholder="банан, кекс, быстро"></div>
    <div class="field"><label for="photo">Фото блюда</label><input id="photo" type="file" accept="image/*"><img id="preview" class="preview" alt="Предпросмотр фото"></div>
    <div class="field"><label for="ingredients">Ингредиенты — каждый с новой строки</label><textarea id="ingredients" required></textarea></div>
    <div class="field"><label for="steps">Приготовление</label><textarea id="steps" required></textarea></div>
    <div class="field"><label for="notes">Заметки</label><textarea id="notes"></textarea></div>
    <div class="actions"><button id="cancelEditBtn" type="button" class="secondary">Отмена</button><button type="submit">Сохранить</button></div>
  </form>
</div>

<div id="viewOverlay" class="overlay" role="dialog" aria-modal="true">
  <div class="sheet recipe"><div id="viewContent"></div><div class="actions"><button id="closeViewBtn" type="button" class="secondary">Закрыть</button></div></div>
</div>

<script>
(() => {
'use strict';
const $ = (id) => document.getElementById(id);
const el = {
  search:$('search'), installNote:$('installNote'), errorBox:$('errorBox'), catgrid:$('catgrid'), chips:$('chips'), grid:$('grid'),
  addBtn:$('addBtn'), backupBtn:$('backupBtn'), restoreBtn:$('restoreBtn'), importFile:$('importFile'),
  editOverlay:$('editOverlay'), editForm:$('editForm'), editTitle:$('editTitle'), recipeName:$('recipeName'), category:$('category'), time:$('time'), tags:$('tags'), photo:$('photo'), preview:$('preview'), ingredients:$('ingredients'), steps:$('steps'), notes:$('notes'), cancelEditBtn:$('cancelEditBtn'),
  viewOverlay:$('viewOverlay'), viewContent:$('viewContent'), closeViewBtn:$('closeViewBtn')
};
const DB='MyRecipesFinalDB', STORE='recipes';
let recipes=[], editingId=null, currentPhoto='', active='Все';
const preferredCats=[['Выпечка','🧁'],['Завтраки','🍳'],['Салаты','🥗'],['Горячее','🍲'],['Рыба','🐟'],['Мясо','🥩'],['Детям','🧸'],['Избранное','★']];
const starter={id:'banana-cake',name:'Банановый кекс',category:'Выпечка',time:'55–60 минут',tags:['банан','кекс','быстро'],favorite:true,photo:'',ingredients:`150 г муки\n80 г сливочного масла\n90–100 г сахара\n1 яйцо\n1 ч. л. ванильного сахара\n100 г натурального греческого йогурта\n100–120 г бананового пюре\n2/3 ч. л. соды\nщепотка соли`,steps:`1. Размять банан в пюре.\n2. Смешать мягкое сливочное масло с сахаром.\n3. Добавить яйцо, ваниль, йогурт и банановое пюре.\n4. Отдельно смешать муку, соду и соль.\n5. Соединить сухие и влажные ингредиенты, не вымешивая слишком долго.\n6. Переложить в форму примерно 21 × 11 см.\n7. Выпекать при 180 °C около 55–60 минут. Проверить шпажкой.`,notes:'Если банан очень спелый, достаточно 90 г сахара. Йогурт 0% подходит вместо сметаны 20%.'};
function showError(msg){el.errorBox.textContent=msg;el.errorBox.style.display='block';}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function uuid(){return (crypto && crypto.randomUUID) ? crypto.randomUUID() : 'r-'+Date.now()+'-'+Math.random().toString(36).slice(2);}
function dbOpen(){return new Promise((res,rej)=>{const q=indexedDB.open(DB,1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains(STORE))q.result.createObjectStore(STORE,{keyPath:'id'});};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
async function dbAll(){const db=await dbOpen();return new Promise((res,rej)=>{const t=db.transaction(STORE,'readonly'),q=t.objectStore(STORE).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error);});}
async function dbPut(r){const db=await dbOpen();return new Promise((res,rej)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(r);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}
async function dbDelete(id){const db=await dbOpen();return new Promise((res,rej)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).delete(id);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}
function openOverlay(node){node.classList.add('open');document.body.style.overflow='hidden';}
function closeOverlay(node){node.classList.remove('open');document.body.style.overflow='';}
function renderCategories(){el.catgrid.innerHTML=preferredCats.map(([name,emoji])=>{const count=name==='Избранное'?recipes.filter(r=>r.favorite).length:recipes.filter(r=>r.category===name).length;const key=name==='Избранное'?'★ Избранное':name;return `<button class="cat" type="button" data-cat="${esc(key)}"><div class="emoji">${emoji}</div><div><div class="name">${esc(name)}</div><div class="count">${count}</div></div></button>`;}).join('');}
function render(){renderCategories();const cats=['Все','★ Избранное',...new Set(recipes.map(r=>r.category).filter(Boolean))];el.chips.innerHTML=cats.map(c=>`<button type="button" class="chip ${c===active?'on':''}" data-chip="${esc(c)}">${esc(c)}</button>`).join('');const q=el.search.value.trim().toLowerCase();const list=recipes.filter(r=>{const inCat=active==='Все'||(active==='★ Избранное'?r.favorite:r.category===active);const hay=[r.name,r.category,(r.tags||[]).join(' '),r.ingredients,r.steps,r.notes].join(' ').toLowerCase();return inCat&&(!q||hay.includes(q));}).sort((a,b)=>(b.favorite?1:0)-(a.favorite?1:0)||a.name.localeCompare(b.name,'ru'));el.grid.innerHTML=list.length?list.map(r=>`<article class="card">${r.photo?`<img class="cover" src="${r.photo}" alt="">`:''}<div class="cardbody"><div class="title">${r.favorite?'★ ':''}${esc(r.name)}</div><div class="meta">${esc(r.category||'Без категории')}${r.time?' · '+esc(r.time):''}</div><div class="tags">${(r.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="row"><button type="button" data-action="view" data-id="${r.id}">Открыть</button><button type="button" class="secondary" data-action="edit" data-id="${r.id}">Изменить</button><button type="button" class="secondary" data-action="fav" data-id="${r.id}">${r.favorite?'★':'☆'}</button></div></div></article>`).join(''):`<div class="empty">В этом разделе пока нет рецептов.</div>`;}
function openEdit(id=null){editingId=id;const r=id?recipes.find(x=>x.id===id):null;el.editTitle.textContent=r?'Изменить рецепт':'Новый рецепт';el.recipeName.value=r?.name||'';el.category.value=r?.category||'Выпечка';el.time.value=r?.time||'';el.tags.value=(r?.tags||[]).join(', ');el.ingredients.value=r?.ingredients||'';el.steps.value=r?.steps||'';el.notes.value=r?.notes||'';currentPhoto=r?.photo||'';el.preview.src=currentPhoto;el.preview.style.display=currentPhoto?'block':'none';el.photo.value='';openOverlay(el.editOverlay);setTimeout(()=>el.recipeName.focus(),100);}
async function saveRecipe(e){e.preventDefault();const old=editingId?recipes.find(x=>x.id===editingId):null;const r={id:editingId||uuid(),name:el.recipeName.value.trim(),category:el.category.value,time:el.time.value.trim(),tags:el.tags.value.split(',').map(x=>x.trim()).filter(Boolean),photo:currentPhoto,ingredients:el.ingredients.value.trim(),steps:el.steps.value.trim(),notes:el.notes.value.trim(),favorite:old?.favorite||false};await dbPut(r);recipes=await dbAll();closeOverlay(el.editOverlay);render();}
async function toggleFav(id){const r=recipes.find(x=>x.id===id);if(!r)return;r.favorite=!r.favorite;await dbPut(r);recipes=await dbAll();render();}
function viewRecipe(id){const r=recipes.find(x=>x.id===id);if(!r)return;el.viewContent.innerHTML=`${r.photo?`<img class="cover" style="border-radius:16px" src="${r.photo}" alt="">`:''}<h2>${r.favorite?'★ ':''}${esc(r.name)}</h2><div class="meta">${esc(r.category||'')}${r.time?' · '+esc(r.time):''}</div><h3>Ингредиенты</h3><pre>${esc(r.ingredients)}</pre><h3>Приготовление</h3><pre>${esc(r.steps)}</pre>${r.notes?`<h3>Заметки</h3><pre>${esc(r.notes)}</pre>`:''}<div class="row"><button type="button" data-view-action="edit" data-id="${r.id}">Изменить</button><button type="button" class="secondary danger" data-view-action="delete" data-id="${r.id}">Удалить</button></div>`;openOverlay(el.viewOverlay);}
async function removeRecipe(id){if(confirm('Удалить рецепт?')){await dbDelete(id);recipes=await dbAll();closeOverlay(el.viewOverlay);render();}}
async function exportBackup(){const data=await dbAll();const blob=new Blob([JSON.stringify({version:2,exported:new Date().toISOString(),recipes:data},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Рецепты_backup.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
async function init(){try{recipes=await dbAll();if(!recipes.length){await dbPut(starter);recipes=[starter];}render();}catch(err){console.error(err);showError('Не удалось открыть локальное хранилище. Обновите страницу в Safari.');}if(!window.matchMedia('(display-mode: standalone)').matches)el.installNote.style.display='block';if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});}}

el.addBtn.addEventListener('click',()=>openEdit());
el.cancelEditBtn.addEventListener('click',()=>closeOverlay(el.editOverlay));
el.closeViewBtn.addEventListener('click',()=>closeOverlay(el.viewOverlay));
el.editOverlay.addEventListener('click',e=>{if(e.target===el.editOverlay)closeOverlay(el.editOverlay);});
el.viewOverlay.addEventListener('click',e=>{if(e.target===el.viewOverlay)closeOverlay(el.viewOverlay);});
el.editForm.addEventListener('submit',e=>saveRecipe(e).catch(err=>showError('Не удалось сохранить рецепт: '+err.message)));
el.search.addEventListener('input',render);
el.catgrid.addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(!b)return;active=b.dataset.cat;render();});
el.chips.addEventListener('click',e=>{const b=e.target.closest('[data-chip]');if(!b)return;active=b.dataset.chip;render();});
el.grid.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const id=b.dataset.id;if(b.dataset.action==='view')viewRecipe(id);if(b.dataset.action==='edit')openEdit(id);if(b.dataset.action==='fav')toggleFav(id).catch(console.error);});
el.viewContent.addEventListener('click',e=>{const b=e.target.closest('[data-view-action]');if(!b)return;const id=b.dataset.id;if(b.dataset.viewAction==='edit'){closeOverlay(el.viewOverlay);openEdit(id);}if(b.dataset.viewAction==='delete')removeRecipe(id).catch(console.error);});
el.photo.addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;const img=new Image(),url=URL.createObjectURL(f);await new Promise((ok,fail)=>{img.onload=ok;img.onerror=fail;img.src=url;});const max=1400,scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);currentPhoto=c.toDataURL('image/jpeg',.82);URL.revokeObjectURL(url);el.preview.src=currentPhoto;el.preview.style.display='block';});
el.backupBtn.addEventListener('click',()=>exportBackup().catch(err=>showError('Не удалось создать копию: '+err.message)));
el.restoreBtn.addEventListener('click',()=>el.importFile.click());
el.importFile.addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const x=JSON.parse(await f.text()),arr=Array.isArray(x)?x:x.recipes;if(!Array.isArray(arr))throw new Error('Неверный формат');for(const r of arr)await dbPut(r);recipes=await dbAll();render();alert('Рецепты восстановлены.');}catch(err){alert('Не удалось прочитать резервную копию.');}e.target.value='';});
init();
})();
</script>
</body>
</html>
